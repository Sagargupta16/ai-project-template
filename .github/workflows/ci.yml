name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked --no-build --extra dev --extra ml --extra api

      - name: Ruff check
        run: uv run --locked --no-build ruff check .

      - name: Ruff format check
        run: uv run --locked --no-build ruff format --check .

      - name: Mypy
        run: uv run --locked --no-build mypy src

      - name: Pytest
        run: uv run --locked --no-build pytest -q

  security:
    uses: Sagargupta16/shared-workflows/.github/workflows/security-scan.yml@526859720d9ce8689f230dafbfa4e40d798b83cb # main
    permissions:
      contents: read
      security-events: write
